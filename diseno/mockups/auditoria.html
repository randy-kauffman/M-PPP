:root{

  --ok:#6fd06f;--okbg:#173317;--warn:#e6bb4f;--warnbg:#3a2f12;--bad:#f47c8a;--badbg:#3d1a20;--info:#58aaf0;--infobg:#15324d;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--f-ui);display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
.hdr{background:var(--header);color:var(--headerink);display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr .app{font-weight:600;font-size:15px;margin-right:auto}
.hdr .app small{font-weight:400;opacity:.75;font-size:12px;margin-left:8px}
.hdr label{font-size:12px;display:flex;align-items:center;gap:6px}
.hdr select{background:rgba(255,255,255,.12);color:var(--headerink);border:1px solid rgba(255,255,255,.28);border-radius:4px;padding:4px 8px}
.hdr select option{color:#111;background:#fff}
.mock{background:var(--warnbg);color:var(--warn);font-size:12px;padding-block:4px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.shell{flex:1;display:flex;min-height:0}
nav{width:210px;flex:none;background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding-block:8px}
nav h4{margin:12px 16px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:600}
nav button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:7px 14px}
nav button:hover{background:var(--surface2)}
nav button.on{background:var(--sel);border-left-color:var(--brand);font-weight:600}
nav button.off{color:var(--muted)}
main{flex:1;min-width:0;overflow:auto;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:20px;font-weight:600;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 10px}
.cmd{display:flex;flex-wrap:wrap;gap:2px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;padding:4px 6px;min-height:38px;align-items:center}
.cmd button{background:none;border:0;border-radius:4px;padding:5px 10px}
.cmd button:hover{background:var(--surface2)}
.cmd .none{color:var(--muted);font-size:12px;padding:0 6px}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:0 0 6px 6px}
.tw.solo{border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px;background:var(--surface2)}
td.wrap{white-space:normal;min-width:220px}
tbody tr:hover{background:var(--surface2)}
tbody tr.clic{cursor:pointer}
tr.selrow{background:var(--sel)!important}
a.lnk{color:var(--brand);text-decoration:none;font-weight:600;cursor:pointer}
a.lnk:hover{text-decoration:underline}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:600}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}.p-info{background:var(--infobg);color:var(--info)}
.form-top{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:12px}
.form-top .back{background:none;border:1px solid var(--line);border-radius:4px;padding:3px 9px}
.form-top .kv{font-size:12px;color:var(--muted)}
.form-top .kv b{display:block;color:var(--text);font-size:13.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px;margin-bottom:12px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px;min-width:0}
.sec h2{font-size:13px;margin:0 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.sec h2 span{color:var(--text);text-transform:none;letter-spacing:0;font-size:14px;margin-left:4px}
.flds{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;margin-bottom:8px}
.fld{font-size:12px;color:var(--muted);min-width:0}
.fld b{display:block;font-weight:400;color:var(--text);font-size:13.5px;overflow-wrap:anywhere}
.file{color:var(--brand)}
details.txt{border:1px solid var(--line);border-radius:4px;padding:6px 9px;margin-top:6px;background:var(--surface2)}
details.txt summary{cursor:pointer;font-size:12.5px;color:var(--brand)}
details.txt pre{white-space:pre-wrap;font:12.5px/1.5 var(--f-ui);margin:6px 0 0}
.sub-h{font-size:12px;font-weight:600;color:var(--muted);margin:8px 0 4px}
/* timeline */
.tl-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:3px 11px;font-size:12.5px}
.chip.on{background:var(--brand);color:var(--brandink);border-color:var(--brand)}
.tl-bar select{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:3px 9px;font-size:12.5px}
.tl-bar .print{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:3px 10px;font-size:12.5px}
.tl{position:relative;margin:0;padding:0;list-style:none}
.tl:before{content:"";position:absolute;left:96px;top:4px;bottom:4px;width:2px;background:var(--line)}
.phase{margin:14px 0 6px 112px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.ev{display:grid;grid-template-columns:86px 20px 1fr;gap:0 6px;align-items:start;padding:4px 0}
.ev .t{text-align:right;font-size:12px;line-height:1.3}
.ev .t b{display:block;font-weight:600;font-size:12.5px}
.ev .t span{color:var(--muted)}
.dot{width:12px;height:12px;border-radius:50%;margin:3px 0 0 4px;border:2px solid var(--surface);box-shadow:0 0 0 2px currentColor;background:currentColor;position:relative;z-index:1}
.card{background:var(--surface2);border:1px solid var(--line);border-left:3px solid currentColor;border-radius:4px;padding:6px 10px;min-width:0}
.card .ti{font-weight:600;color:var(--text)}
.card .me{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:1px}
.card .why{margin-top:5px;font-size:13px;color:var(--text);background:var(--surface);border-radius:3px;padding:5px 8px;white-space:pre-wrap}
.card details{margin-top:5px;color:var(--text)}
.card details summary{cursor:pointer;font-size:12.5px;color:var(--brand)}
.card details pre{white-space:pre-wrap;font:12.5px/1.5 var(--f-ui);margin:5px 0 0}
.fchip{border:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 7px;font-size:11.5px;font-weight:600;color:var(--brand)}
.c-rec{color:var(--ph-rec)}.c-val{color:var(--ph-val)}.c-acu{color:var(--ph-acu)}.c-reg{color:var(--ph-reg)}.c-cie{color:var(--ph-cie)}.c-inc{color:var(--ph-inc)}
.rules{margin:6px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--text)}
.rules li{padding:3px 0;border-top:1px dashed var(--line)}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);box-shadow:var(--shadow);padding:0;width:min(560px,calc(100% - 32px))}
dialog::backdrop{background:rgba(10,20,35,.45)}
dialog header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}
dialog header button{background:none;border:0;font-size:18px;line-height:1}
dialog .body{padding:12px 14px;max-height:70vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (max-width:720px){
  .shell{flex-direction:column}
  nav{width:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;padding:4px}
  nav h4{width:100%;margin:6px 10px 2px}
  nav button{width:auto;border-left:0;border-bottom:3px solid transparent;padding:6px 10px}
  nav button.on{border-bottom-color:var(--brand)}
  .tl:before{left:58px}.phase{margin-left:74px}
  .ev{grid-template-columns:50px 20px 1fr}.ev .t span{display:none}
}
@media (prefers-reduced-motion:no-preference){.card{transition:background .15s}}
</style>

    if (h < 24) return "+" + h + " h" + (r ? " " + r + " min" : "");

    var opcionesFila = "<option value=\"\">" + esc(t("todasFilas")) + "</option>" + s.filas.map(function (f) { return "<option value=\"" + f.n + "\"" + (String(f.n) === estado.fila ? " selected" : "") + ">" + esc(t("fichaFila")) + " " + f.n + " · " + esc(f.b) + "</option>"; }).join("");
    var bar = "<div class=\"tl-bar\">" + filtros.map(function (f) { return "<button class=\"chip" + (estado.filtro === f[0] && !estado.fila ? " on" : "") + "\" data-filtro=\"" + f[0] + "\">" + esc(f[1]) + "</button>"; }).join("") +
      (s.filas.length ? "<label class=\"sr\" for=\"selFila\" hidden>" + esc(t("unaFila")) + "</label><select id=\"selFila\" aria-label=\"" + esc(t("unaFila")) + "\">" + opcionesFila + "</select>" : "") +
      "<button class=\"print\" id=\"btnPrint\">" + esc(t("imprimir")) + "</button></div>";

    var evs = s.bit.map(function (b) { return { f: d(b[0]), ev: b[1], or: b[2], fila: b[3], q: b[4], det: b[5], ph: EV[b[1]][0] }; })
      .sort(function (a, b) { return a.f - b.f; })
      .filter(function (e) {
        if (estado.fila) return e.fila === Number(estado.fila);
        if (estado.filtro === "sol") return e.fila === 0 && e.ph !== "inc";
        if (estado.filtro === "reg") return e.fila > 0;
        if (estado.filtro === "inc") return e.ph === "inc";
        return true;
      });
    if (!evs.length) return bar + "<div class=\"empty\">" + esc(t("sinEventos")) + "</div>";

    var fallidas = s.reglas.filter(function (r) { return r[2] !== "Cumplida"; });
    var rechazadas = s.filas.filter(function (f) { return f.e === "Rechazada"; });
    var html = "", fase = null, diaAnt = null;
    evs.forEach(function (e) {
      if (e.ph !== fase && e.ph !== "inc") { fase = e.ph; html += "<li class=\"phase c-" + e.ph + "\">" + esc(t("ph")[e.ph]) + "</li>"; }
      var nombre = en() ? EV[e.ev][2] : EV[e.ev][1];
      var me = "<span>" + esc(quien(e.q)) + "</span><span>" + esc(ORIGEN[e.or][en() ? 1 : 0]) + "</span>" +
        (e.fila ? "<button class=\"fchip\" data-fila=\"" + e.fila + "\" title=\"" + esc(t("abrirFila")) + "\">" + esc(t("fichaFila")) + " " + e.fila + "</button>" : "") +
        (e.ph === "inc" ? "<span class=\"pill p-bad\">" + esc(t("ph").inc) + "</span>" : "");
      var cuerpo = "";
      if (e.det) {
        cuerpo += e.det.length > 160 ? "<details><summary>" + esc(t("verTexto")) + "</summary><pre>" + esc(e.det) + "</pre></details>" : "<div class=\"why\">" + esc(e.det) + "</div>";
      }
      if (e.ev === "ValidacionTerminada" && (fallidas.length || rechazadas.length)) {
        cuerpo += "<details><summary>" + esc(t("verReglas")) + "</summary><ul class=\"rules\">" +
          fallidas.map(function (r) { return "<li><b>" + esc(r[1]) + "</b> · " + esc(r[3]) + " — " + esc(r[4]) + "</li>"; }).join("") +
          rechazadas.map(function (f) { return "<li><b>" + esc(t("fichaFila")) + " " + f.n + "</b> — " + esc(f.msg) + "</li>"; }).join("") + "</ul></details>";
      }
      if (e.ev === "AcuseEnviado" && s.acuseTxt) cuerpo += "<details><summary>" + esc(t("verCont")) + "</summary><pre>" + esc(s.acuseTxt) + "</pre></details>";
      if (e.ev === "RespuestaFinalEnviada" && s.respTxt) cuerpo += "<details><summary>" + esc(t("verCont")) + "</summary><pre>" + esc(s.respTxt) + "</pre></details>";
      var nuevoDia = dia(e.f) !== diaAnt; diaAnt = dia(e.f);
      html += "<li class=\"ev c-" + e.ph + "\"><div class=\"t num\"><b>" + (nuevoDia ? dia(e.f) + " " : "") + hora(e.f) + "</b><span>" + transcurrido(s.rec, e.f) + "</span></div><div class=\"dot\"></div>" +
        "<div class=\"card\"><div class=\"ti\">" + esc(nombre) + "</div><div class=\"me\">" + me + "</div>" + cuerpo + "</div></li>";
    });
    return bar + "<ol class=\"tl\">" + html + "</ol>";
  }

  function pintarTimeline() { var el = document.getElementById("tl"); if (el) el.innerHTML = timeline(estado.sol); }

  // ------------------------------------------------------------------ formulario de Auditoría de Fila (diálogo)
  function abrirFila(n) {
    var f = estado.sol.filas.filter(function (x) { return x.n === Number(n); })[0];
    if (!f) return;
    document.getElementById("dlgT").textContent = estado.sol.n + " · " + t("fichaFila") + " " + f.n;
    document.getElementById("dlgB").innerHTML = "<div class=\"flds\">" +
      fld(t("cEst"), pill(ESTADO_FILA, f.e)) + fld(t("fG"), esc(f.g)) + fld(t("fP"), esc(f.p)) + fld(t("fB"), esc(f.b)) +
      fld(t("fTipoId"), esc(f.tid)) + fld(t("fNumId"), "<span class=\"num\">" + esc(f.nid) + "</span>") + fld(t("fCta"), "<span class=\"num\">" + esc(f.cta) + "</span>") +
      fld(t("fBanco"), esc(f.banco)) + fld(t("fMon"), esc(f.mon)) + fld(t("fRefR"), esc(f.refr)) + fld(t("fRefV"), esc(f.refv)) +
      fld(t("fDig"), esc(f.dig ? f.dig + " · " + fecha(f.fd) : "")) + fld(t("fApr"), esc(f.apr ? f.apr + " · " + fecha(f.fa) : "")) + "</div>" +
      "<div class=\"flds\">" + fld(t("fMsg"), esc(f.msg)) + fld(t("fNota"), esc(f.nota)) + "</div>";
    var dlg = document.getElementById("dlg");
    if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
  }

  // ------------------------------------------------------------------ pintar todo
  function pintar() {
    document.documentElement.lang = en() ? "en" : "es";
    document.getElementById("appSub").textContent = t("sub");
    document.getElementById("lblRol").textContent = t("rol");
    document.getElementById("lblIdioma").textContent = t("idioma");
    document.getElementById("mockNote").textContent = t("mock");
    document.getElementById("dlgX").setAttribute("aria-label", t("cerrar"));
    document.getElementById("rol").value = estado.rol;
    document.getElementById("idioma").value = estado.lcid;
    pintarNav();
    var main = document.getElementById("main");
    if (estado.vista === "form" && estado.sol) { main.innerHTML = formulario(estado.sol); pintarTimeline(); }
    else if (estado.vista === "bit") main.innerHTML = vistaBitacora();
    else if (estado.vista === "fil") main.innerHTML = vistaFilas();
    else main.innerHTML = vistaSolicitudes();
  }

  function abrirSolicitud(id) { estado.sol = solPorId(id); estado.vista = "form"; estado.filtro = "todo"; estado.fila = ""; pintar(); document.getElementById("main").scrollTop = 0; }

  document.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-v],[data-sol],[data-fila],[data-filtro],[data-cmd],[data-selfila],#btnPrint,#dlgX");
    if (!el) return;
    if (el.id === "dlgX") { document.getElementById("dlg").close(); return; }
    if (el.id === "btnPrint") { toast(t("impToast")); return; }
    if (el.dataset.v) { estado.vista = el.dataset.v; pintar(); return; }
    if (el.dataset.sol) { abrirSolicitud(el.dataset.sol); return; }
    if (el.dataset.fila) { abrirFila(el.dataset.fila); return; }
    if (el.dataset.filtro) { estado.filtro = el.dataset.filtro; estado.fila = ""; pintarTimeline(); return; }
    if (el.dataset.cmd) { toast(t("hecho") + el.dataset.cmd); return; }
    if (el.dataset.selfila) {
      var k = el.dataset.selfila;
      if (estado.selFilas[k]) delete estado.selFilas[k]; else estado.selFilas[k] = el.dataset.est;
      pintar();
    }
  });
  document.addEventListener("change", function (ev) {
    if (ev.target.id === "rol") { estado.rol = ev.target.value; guardar(); pintar(); }
    if (ev.target.id === "idioma") { estado.lcid = ev.target.value; guardar(); pintar(); }
    if (ev.target.id === "selFila") { estado.fila = ev.target.value; pintarTimeline(); }
  });

  // Abre directo en el formulario de la solicitud más completa: es lo que hay que aprobar.
  estado.sol = SOL[0]; estado.vista = "form";
  pintar();
})();
</script>
