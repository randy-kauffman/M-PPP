<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline de auditoría</title>
<style>
:root{
  --bg:#ffffff;
  --surface:#ffffff;
  --surface2:#faf9f8;
  --hover:#f3f2f1;
  --line:#e0e0e0;
  --text:#242424;
  --muted:#616161;
  --brand:#0f6cbd;
  --brand-hover:#115ea3;
  --brandink:#ffffff;
  --bad:#c50f1f;
  --ph-rec:#5b5fc7;
  --ph-val:#0f6cbd;
  --ph-acu:#0b7a75;
  --ph-reg:#8a5a00;
  --ph-cie:#0e700e;
  --f-ui:"Segoe UI","Segoe UI Web (West European)",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font:14px/1.45 var(--f-ui);
  padding-block:8px 16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,select{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
.cab{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.cab b{color:var(--text);font-weight:600}
.tl-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.chip{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text);
  border-radius:4px;
  padding:4px 12px;
  font-size:12.5px;
  font-weight:500;
}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--brand);color:var(--brandink);border-color:var(--brand)}
.chip.on:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.tl-bar select{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text);
  border-radius:4px;
  padding:4px 10px;
  font-size:12.5px;
  max-width:100%;
}
.tl-bar select:hover{background:var(--hover)}
.tl-bar .print{
  margin-left:auto;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text);
  border-radius:4px;
  padding:4px 12px;
  font-size:12.5px;
  font-weight:500;
}
.tl-bar .print:hover{background:var(--hover)}
.tl{position:relative;margin:0;padding:0;list-style:none}
.tl:before{content:"";position:absolute;left:96px;top:4px;bottom:4px;width:2px;background:var(--line)}
.phase{margin:14px 0 6px 112px;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.ev{display:grid;grid-template-columns:86px 20px 1fr;gap:0 6px;align-items:start;padding:4px 0;break-inside:avoid}
.ev .t{text-align:right;font-size:12px;line-height:1.3}
.ev .t b{display:block;font-weight:600;font-size:12.5px;color:var(--text)}
.ev .t span{color:var(--muted)}
.dot{
  width:10px;height:10px;border-radius:50%;
  margin:4px 0 0 5px;
  border:2px solid var(--surface);
  box-shadow:0 0 0 2px currentColor;
  background:currentColor;
  position:relative;z-index:1;
}
.card{
  background:var(--surface2);
  border:1px solid var(--line);
  border-left:3px solid currentColor;
  border-radius:4px;
  padding:8px 12px;
  min-width:0;
}
.card .ti{font-weight:600;color:var(--text)}
.card .me{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px;align-items:center}
.card .why{
  margin-top:6px;
  font-size:13px;
  color:var(--text);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:4px;
  padding:6px 10px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.card details{margin-top:6px;color:var(--text)}
.card details summary{cursor:pointer;font-size:12.5px;color:var(--brand);font-weight:500}
.card details summary:hover{text-decoration:underline}
.card details pre{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font:12.5px/1.5 var(--f-ui);
  margin:6px 0 0;
  padding:8px 10px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:4px;
}
.fchip{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:4px;
  padding:1px 8px;
  font-size:11.5px;
  font-weight:600;
  color:var(--brand);
}
.fchip:hover{background:var(--hover)}
.c-rec{color:var(--ph-rec)}
.c-val{color:var(--ph-val)}
.c-acu{color:var(--ph-acu)}
.c-reg{color:var(--ph-reg)}
.c-cie{color:var(--ph-cie)}
.rules{margin:6px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--text)}
.rules li{padding:4px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.aviso{color:var(--muted);font-size:13px;padding:10px 0}
.aviso.mal{color:var(--bad)}
@media (max-width:720px){
  .tl:before{left:58px}.phase{margin-left:74px}
  .ev{grid-template-columns:50px 20px 1fr}.ev .t span{display:none}
}
@media print{
  :root{--bg:#fff;--surface:#fff;--surface2:#fff;--line:#bbb;--text:#000;--muted:#333;--brand:#000;
    --ph-rec:#333;--ph-val:#333;--ph-acu:#333;--ph-reg:#333;--ph-cie:#333;--bad:#000}
  body{padding:0;font-size:11pt}
  .tl-bar{display:none}
  .card{border-color:#999;border-left:3px solid #333;background:#fff}
  .card details summary{display:none}
  .card .why,.card details pre{background:#fff;border:1px solid #ddd}
  .fchip{border:1px solid #666;color:#000}
}
@media (prefers-reduced-motion:no-preference){.card,.chip,.print{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div id="raiz"><div class="aviso" id="msg">…</div></div>

<script type="text/javascript">
(function () {
  "use strict";

  var SOLICITUD = "sanic_mppp_tbl_solicitud";
  var FILA = "sanic_mppp_tbl_fila";
  var BITACORA = "sanic_mppp_tbl_bitacora";
  var RESULTADO = "sanic_mppp_tbl_resultadoregla";
  var PAGINA = 5000;

  // ---------------------------------------------------------------- textos (solo español)
  var T = {
    titulo: "Timeline de auditoría",
    recibida: "Recibida",
    todo: "Todo",
    solicitud: "Solicitud",
    registros: "Registros",
    unaFila: "Recorrido de una fila",
    todasFilas: "Todas las filas",
    fila: "Fila",
    imprimir: "Imprimir",
    abrirFila: "Abrir la fila",
    verTexto: "Ver texto completo",
    verReglas: "Ver reglas no cumplidas",
    verContenido: "Ver lo que se le mandó al cliente",
    servicio: "Cuenta de servicio",
    sistema: "Sistema",
    sinEventos: "No hay eventos con este filtro.",
    sinBitacora: "Esta solicitud todavía no tiene eventos en la bitácora.",
    cargando: "Cargando…",
    sinId: "Guarda la solicitud primero: todavía no tiene identificador.",
    sinXrm: "No se pudo acceder a los datos del formulario.",
    errorLeer: "No se pudo leer la información de la solicitud.",
    noEncontrada: "No se encontró la solicitud."
  };

  var FASES = {
    rec: "Recepción",
    val: "Validación",
    acu: "Acuse",
    reg: "Trabajo sobre los registros",
    cie: "Cierre y respuesta"
  };

  // Valores del choice global sanic_mppp_ch_eventobitacora (sin eventos de incidencia)
  var EVENTOS = {
    159460001: ["rec", "Ingresada"],
    159460019: ["rec", "Correo clasificado"],
    159460002: ["val", "Validación terminada"],
    159460003: ["acu", "Acuse iniciado"],
    159460004: ["acu", "Acuse enviado"],
    159460005: ["reg", "Fila digitada"],
    159460006: ["reg", "Fila aprobada"],
    159460007: ["reg", "Fila devuelta"],
    159460008: ["reg", "Fila rechazada en AS400"],
    159460018: ["reg", "Fila anulada"],
    159460009: ["cie", "Procesada"],
    159460010: ["cie", "Respuesta final iniciada"],
    159460011: ["cie", "Respuesta final enviada"],
    159460012: ["cie", "Cerrada"],
    159460013: ["cie", "No reconocida atendida"],
    159460014: ["cie", "Descartada"]
  };
  var EV_ACUSE_ENVIADO = 159460004, EV_VALIDACION = 159460002, EV_RESPUESTA_ENVIADA = 159460011;

  // sanic_mppp_ch_origenevento
  var ORIGENES = {
    159460001: "MPPP-REC", 159460002: "MPPP-ING", 159460003: "MPPP-COM", 159460004: "MPPP-ENV",
    159460005: "MPPP-VIG", 159460006: "Custom API", 159460007: "Plugin", 159460008: "App"
  };
  var ORIGEN_PLUGIN = 159460007, ORIGEN_APP = 159460008;

  // sanic_mppp_ch_estadofila rechazadas por la validación
  var FILA_RECHAZADA_VALIDACION = 159460001, FILA_SIN_AUTORIZACION = 159460002;
  // sanic_mppp_ch_resultadoregla
  var REGLA_NO_CUMPLIDA = 159460002;
  // sanic_mppp_ch_efectoregla
  var EFECTOS = { 159460001: "Rechaza", 159460002: "Envía a revisión", 159460003: "Advierte" };

  // ---------------------------------------------------------------- estado
  var estado = { filtro: "todo", fila: "" };
  var datos = null;
  var raiz = document.getElementById("raiz");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c];
    });
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function dia(x) { return pad(x.getDate()) + "/" + pad(x.getMonth() + 1); }
  function hora(x) { return pad(x.getHours()) + ":" + pad(x.getMinutes()); }
  function aFecha(v) { if (!v) return null; var d = new Date(v); return isNaN(d.getTime()) ? null : d; }
  function transcurrido(desde, hasta) {
    var m = Math.max(0, Math.round((hasta - desde) / 60000));
    if (m < 60) return "+" + m + " min";
    var h = Math.floor(m / 60), r = m % 60;
    if (h < 24) return "+" + h + " h" + (r ? " " + r + " min" : "");
    var dd = Math.floor(h / 24), hh = h % 24;
    return "+" + dd + " d" + (hh ? " " + hh + " h" : "");
  }

  // ---------------------------------------------------------------- contexto
  function idDelRegistro() {
    var busqueda = window.location.search || "";
    var partes = busqueda.replace("?", "").split("&");
    var datosQs = {};
    for (var i = 0; i < partes.length; i++) {
      var par = partes[i].split("=");
      if (par.length === 2) datosQs[decodeURIComponent(par[0])] = decodeURIComponent(par[1]);
    }
    var id = datosQs.id || datosQs.ID || "";
    if (!id && datosQs.data) {
      var internos = datosQs.data.split("&");
      for (var j = 0; j < internos.length; j++) {
        var p = internos[j].split("=");
        if (p.length === 2 && p[0].toLowerCase() === "id") id = decodeURIComponent(p[1]);
      }
    }
    return id.replace("{", "").replace("}", "");
  }

  function xrm() {
    if (window.parent && window.parent.Xrm) return window.parent.Xrm;
    if (window.Xrm) return window.Xrm;
    return null;
  }

  function aviso(texto, malo) {
    raiz.innerHTML = "<div class=\"aviso" + (malo ? " mal" : "") + "\">" + esc(texto) + "</div>";
  }

  // ---------------------------------------------------------------- lectura (SOLO LEE)
  function leerTodas(api, tabla, opciones) {
    var acumulado = [];
    function pagina(opc) {
      return api.WebApi.retrieveMultipleRecords(tabla, opc, PAGINA).then(function (r) {
        acumulado = acumulado.concat(r.entities || []);
        if (r.nextLink) {
          var q = r.nextLink.indexOf("?");
          return pagina(q >= 0 ? r.nextLink.substring(q) : opc);
        }
        return acumulado;
      });
    }
    return pagina(opciones);
  }

  function cargar(api, id) {
    var filtro = "&$filter=_sanic_solicitudid_value eq " + id;
    var pSol = api.WebApi.retrieveRecord(SOLICITUD, id,
      "?$select=sanic_nombre,sanic_fecharecibido,sanic_acusecontenido,sanic_respuestafinalcontenido," +
      "sanic_fechaacuseenviado,sanic_fecharespuestafinalenviada,sanic_fechavalidada,sanic_fechaprocesada,sanic_fechacerrada");
    var pBit = leerTodas(api, BITACORA,
      "?$select=sanic_fechaevento,sanic_evento,sanic_origen,sanic_numerofila,sanic_actortexto,sanic_detalle" +
      filtro + "&$orderby=sanic_fechaevento asc");
    var pFilas = leerTodas(api, FILA,
      "?$select=sanic_mppp_tbl_filaid,sanic_numerofila,sanic_nombrebeneficiario,sanic_estado,sanic_mensaje" + filtro + "&$orderby=sanic_numerofila asc");
    var pReglas = leerTodas(api, RESULTADO,
      "?$select=sanic_orden,sanic_reglacodigo,sanic_resultado,sanic_efectoaplicado,sanic_razon" + filtro + "&$orderby=sanic_orden asc");
    return Promise.all([pSol, pBit, pFilas, pReglas]).then(function (r) {
      var filaPorNumero = {};
      for (var i = 0; i < r[2].length; i++) filaPorNumero[r[2][i].sanic_numerofila] = r[2][i];
      return { sol: r[0], eventos: r[1], filas: r[2], reglas: r[3], filaPorNumero: filaPorNumero };
    });
  }

  // ---------------------------------------------------------------- pintado
  function quien(e) {
    if (e.sanic_actortexto) return e.sanic_actortexto;
    var o = e.sanic_origen;
    return (o === ORIGEN_PLUGIN || o === ORIGEN_APP) ? T.sistema : T.servicio;
  }

  function pintar() {
    var d = datos, sol = d.sol, recibida = aFecha(sol.sanic_fecharecibido);

    var filtros = [["todo", T.todo], ["sol", T.solicitud], ["reg", T.registros]];
    var opcionesFila = "<option value=\"\">" + esc(T.todasFilas) + "</option>" + d.filas.map(function (x) {
      var n = x.sanic_numerofila;
      return "<option value=\"" + esc(n) + "\"" + (String(n) === estado.fila ? " selected" : "") + ">" +
        esc(T.fila) + " " + esc(n) + " · " + esc(x.sanic_nombrebeneficiario) + "</option>";
    }).join("");
    var barra = "<div class=\"tl-bar\">" + filtros.map(function (x) {
      return "<button type=\"button\" class=\"chip" + (estado.filtro === x[0] && !estado.fila ? " on" : "") + "\" data-filtro=\"" + x[0] + "\">" + esc(x[1]) + "</button>";
    }).join("") +
      (d.filas.length ? "<select id=\"selFila\" aria-label=\"" + esc(T.unaFila) + "\">" + opcionesFila + "</select>" : "") +
      "<button type=\"button\" class=\"print\" id=\"btnPrint\">" + esc(T.imprimir) + "</button></div>";

    var cab = "<p class=\"cab\"><b>" + esc(sol.sanic_nombre) + "</b>" +
      (recibida ? " · " + esc(T.recibida) + " " + esc(dia(recibida)) + " " + esc(hora(recibida)) : "") + "</p>";

    var evsTodos = d.eventos.filter(function (b) {
      return Boolean(EVENTOS[b.sanic_evento]);
    }).map(function (b) {
      var info = EVENTOS[b.sanic_evento];
      return { b: b, f: aFecha(b.sanic_fechaevento), fase: info[0], nombre: info[1], fila: Number(b.sanic_numerofila) || 0 };
    });

    if (!evsTodos.length) { raiz.innerHTML = cab + barra + "<div class=\"aviso\">" + esc(T.sinBitacora) + "</div>"; return; }

    var evs = evsTodos.filter(function (e) {
      if (estado.fila) return e.fila === Number(estado.fila);
      if (estado.filtro === "sol") return e.fila === 0;
      if (estado.filtro === "reg") return e.fila > 0;
      return true;
    });
    if (!evs.length) { raiz.innerHTML = cab + barra + "<div class=\"aviso\">" + esc(T.sinEventos) + "</div>"; return; }

    var fallidas = d.reglas.filter(function (r) { return r.sanic_resultado === REGLA_NO_CUMPLIDA; });
    var rechazadas = d.filas.filter(function (x) { return x.sanic_estado === FILA_RECHAZADA_VALIDACION || x.sanic_estado === FILA_SIN_AUTORIZACION; });

    var html = "", fase = null, diaAnt = null;
    evs.forEach(function (e) {
      if (e.fase !== fase) {
        fase = e.fase;
        html += "<li class=\"phase c-" + e.fase + "\">" + esc(FASES[e.fase]) + "</li>";
      }
      var origen = ORIGENES[e.b.sanic_origen] || "";
      var me = "<span>" + esc(quien(e.b)) + "</span>" + (origen ? "<span>" + esc(origen) + "</span>" : "") +
        (e.fila && d.filaPorNumero[e.fila] ? "<button type=\"button\" class=\"fchip\" data-fila=\"" + esc(e.fila) + "\" title=\"" + esc(T.abrirFila) + "\">" + esc(T.fila) + " " + esc(e.fila) + "</button>"
          : (e.fila ? "<span class=\"fchip\">" + esc(T.fila) + " " + esc(e.fila) + "</span>" : ""));
      var cuerpo = "";
      var det = e.b.sanic_detalle;
      if (det) {
        cuerpo += det.length > 160
          ? "<details><summary>" + esc(T.verTexto) + "</summary><pre>" + esc(det) + "</pre></details>"
          : "<div class=\"why\">" + esc(det) + "</div>";
      }
      if (e.b.sanic_evento === EV_VALIDACION && (fallidas.length || rechazadas.length)) {
        cuerpo += "<details><summary>" + esc(T.verReglas) + "</summary><ul class=\"rules\">" +
          fallidas.map(function (r) {
            var ef = EFECTOS[r.sanic_efectoaplicado];
            return "<li><b>" + esc(r.sanic_reglacodigo) + "</b>" + (ef ? " · " + esc(ef) : "") +
              (r.sanic_razon ? " — " + esc(r.sanic_razon) : "") + "</li>";
          }).join("") +
          rechazadas.map(function (x) {
            return "<li><b>" + esc(T.fila) + " " + esc(x.sanic_numerofila) + "</b>" + (x.sanic_mensaje ? " — " + esc(x.sanic_mensaje) : "") + "</li>";
          }).join("") + "</ul></details>";
      }
      if (e.b.sanic_evento === EV_ACUSE_ENVIADO && sol.sanic_acusecontenido) {
        cuerpo += "<details><summary>" + esc(T.verContenido) + "</summary><pre>" + esc(textoPlano(sol.sanic_acusecontenido)) + "</pre></details>";
      }
      if (e.b.sanic_evento === EV_RESPUESTA_ENVIADA && sol.sanic_respuestafinalcontenido) {
        cuerpo += "<details><summary>" + esc(T.verContenido) + "</summary><pre>" + esc(textoPlano(sol.sanic_respuestafinalcontenido)) + "</pre></details>";
      }
      var cuando = e.f ? (dia(e.f) !== diaAnt ? dia(e.f) + " " : "") + hora(e.f) : "—";
      if (e.f) diaAnt = dia(e.f);
      html += "<li class=\"ev c-" + e.fase + "\"><div class=\"t num\"><b>" + esc(cuando) + "</b><span>" +
        (e.f && recibida ? esc(transcurrido(recibida, e.f)) : "") + "</span></div><div class=\"dot\"></div>" +
        "<div class=\"card\"><div class=\"ti\">" + esc(e.nombre) + "</div><div class=\"me\">" + me + "</div>" + cuerpo + "</div></li>";
    });
    raiz.innerHTML = cab + barra + "<ol class=\"tl\">" + html + "</ol>";
  }

  function textoPlano(html) {
    var doc;
    try { doc = new DOMParser().parseFromString(String(html), "text/html"); } catch (e) { return String(html); }
    var cuerpo = doc.body ? doc.body.innerHTML : String(html);
    cuerpo = cuerpo.replace(/<\s*br\s*\/?>/gi, "\n").replace(/<\/(p|div|li|tr|h[1-6])>/gi, "\n");
    var tmp = doc.createElement("div");
    tmp.innerHTML = cuerpo;
    return (tmp.textContent || "").replace(/\n{3,}/g, "\n\n").trim();
  }

  // ---------------------------------------------------------------- eventos
  document.addEventListener("click", function (ev) {
    var el = ev.target.closest ? ev.target.closest("[data-filtro],[data-fila],#btnPrint") : null;
    if (!el || !datos) return;
    if (el.id === "btnPrint") { window.print(); return; }
    if (el.getAttribute("data-filtro")) { estado.filtro = el.getAttribute("data-filtro"); estado.fila = ""; pintar(); return; }
    if (el.getAttribute("data-fila")) {
      var fila = datos.filaPorNumero[el.getAttribute("data-fila")];
      var api = xrm();
      if (fila && api && api.Navigation) {
        api.Navigation.openForm({ entityName: FILA, entityId: fila.sanic_mppp_tbl_filaid });
      }
    }
  });
  document.addEventListener("change", function (ev) {
    if (ev.target && ev.target.id === "selFila") { estado.fila = ev.target.value; pintar(); }
  });

  var abiertos = [];
  window.addEventListener("beforeprint", function () {
    abiertos = [];
    var ds = document.querySelectorAll("details");
    for (var i = 0; i < ds.length; i++) { if (!ds[i].open) { ds[i].open = true; abiertos.push(ds[i]); } }
  });
  window.addEventListener("afterprint", function () {
    for (var i = 0; i < abiertos.length; i++) abiertos[i].open = false;
    abiertos = [];
  });

  // ---------------------------------------------------------------- arranque
  function arrancar() {
    var api = xrm();
    document.title = T.titulo;
    var id = idDelRegistro();
    if (!id) { aviso(T.sinId, false); return; }
    if (!api || !api.WebApi) { aviso(T.sinXrm, true); return; }
    aviso(T.cargando, false);
    cargar(api, id).then(function (r) {
      datos = r;
      pintar();
    }, function (err) {
      var m = err && err.message ? String(err.message) : "";
      aviso(/does not exist|not found|0x80040217/i.test(m) ? T.noEncontrada : T.errorLeer, true);
    });
  }
  arrancar();
})();
</script>
</body>
</html>
